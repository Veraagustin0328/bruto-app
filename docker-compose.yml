# Postgres local para desarrollar, nada más
# Levantalo con: docker compose up -d
# Usa el 5433 afuera porque el 5432 lo tiene otro proyecto

services:
  db:
    image: postgres:16
    container_name: bruto-db
    environment:
      POSTGRES_USER: bruto
      POSTGRES_PASSWORD: bruto
      POSTGRES_DB: bruto
    ports:
      - "5433:5432"
    volumes:
      - bruto_data:/var/lib/postgresql/data

volumes:
  bruto_data:
